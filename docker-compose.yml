services:
  nacionalseguros.api:
    container_name: nacionalseguros.api
    image: docker-nacionalseguros.api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=SIR_NacionalSeguros;User Id=sa;Password=Intersim.1234;TrustServerCertificate=True;Encrypt=False;
      - Redis__ConnectionString=host.docker.internal:6379
    restart: always

  nacionalseguros.frontend:
    container_name: nacionalseguros.frontend
    image: docker-nacionalseguros.frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    restart: always
