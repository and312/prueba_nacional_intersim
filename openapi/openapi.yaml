    patch:
      summary: Actualizar Parcial WhatsApp Session (n8n/Legacy)
      tags:
        - Internal APIs (Legacy/n8n)
      security:
        - InternalApiKeyAuth: []
      parameters:
        - name: normalizedIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sesión actualizada con éxito.
    delete:
      summary: Eliminar WhatsApp Session (n8n/Legacy)
      tags:
        - Internal APIs (Legacy/n8n)
      security:
        - InternalApiKeyAuth: []
      parameters:
        - name: normalizedIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sesión eliminada con éxito.

components:
  # ==========================================
  # ESQUEMAS DE SEGURIDAD (SECURITY SCHEMES)
  # ==========================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ingresar el token JWT provisto tras el inicio de sesión.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Token secreto asignado exclusivamente a los workflows de n8n.
    InternalApiKeyAuth:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: API Key interna obligatoria para la autenticación de workflows automatizados (Canal 2).

  # ==========================================
  # CABECERAS COMUNES (HEADERS)
  # ==========================================
  headers:
    CorrelationIdHeader:
      description: ID unificada para la trazabilidad y rastreo de logs extremos de la petición.
      schema:
        type: string
        format: uuid

  # ==========================================
  # PARÁMETROS COMUNES (PARAMETERS)
  # ==========================================
  parameters:
    PageNumber:
      name: page
      in: query
      required: false
      description: Número de página (1-indexed).
      schema:
        type: integer
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Cantidad de registros por página.
      schema:
        type: integer
        default: 10
    SearchQuery:
      name: q
      in: query
      required: false
      description: Término de búsqueda general.
      schema:
        type: string

  # ==========================================
  # RESPUESTAS COMUNES (RESPONSES)
  # ==========================================
  responses:
    BadRequestError:
      description: Petición inválida o error sintáctico en DTO.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorDto'
    UnauthorizedError:
      description: Autenticación ausente o inválida.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorDto'
    ForbiddenError:
      description: Permisos insuficientes (Falla de autorización RBAC).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorDto'
    NotFoundError:
      description: El recurso solicitado no existe.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorDto'
    InternalServerError:
      description: Error no controlado en el servidor.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorDto'
    TooManyRequestsError:
      description: Límite de peticiones excedido (Too Many Requests). Máximo 10 peticiones por minuto por IP.
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Cantidad máxima de peticiones autorizadas por ventana (10).
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Cantidad de peticiones disponibles restantes en la ventana actual.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Segundos restantes para que la ventana de límite de tasa se restablezca.
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorDto'

  # ==========================================
  # ESQUEMAS DE DATOS (SCHEMAS / DTOS)
  # ==========================================
  schemas:
    # DTOS: Autenticación
    LoginRequestDto:
      type: object
      required:
        - correo
        - clave
        - tipoAutenticacion
      properties:
        correo:
          type: string
          format: email
        clave:
          type: string
        tipoAutenticacion:
          type: string
          enum: [Local, ActiveDirectory]
    LoginResponseDto:
      type: object
      properties:
        token:
          type: string
          description: Token de acceso JWT (expiración corta).
        expiraEnSegundos:
          type: integer
        usuario:
          $ref: '#/components/schemas/UsuarioResponseDto'
        mfaRequerido:
          type: boolean
    TokenRefreshRequestDto:
      type: object
      required:
        - tokenExpirado
        - refreshToken
      properties:
        tokenExpirado:
          type: string
        refreshToken:
          type: string
    MfaVerifyRequestDto:
      type: object
      required:
        - correo
        - codigoOtp
      properties:
        correo:
          type: string
          format: email
        codigoOtp:
          type: string
          minLength: 6
          maxLength: 6
    ChangePasswordRequestDto:
      type: object
      required:
        - claveActual
        - nuevaClave
      properties:
        claveActual:
          type: string
        nuevaClave:
          type: string
          minLength: 8

    # DTOS: Usuarios
    UsuarioCreateDto:
      type: object
      required:
        - correo
        - nombres
        - tipoAutenticacion
      properties:
        correo:
          type: string
          format: email
        nombres:
          type: string
        tipoAutenticacion:
          type: string
          enum: [Local, ActiveDirectory]
        clave:
          type: string
          minLength: 8
    UsuarioUpdateDto:
      type: object
      properties:
        nombres:
          type: string
        activo:
          type: boolean
    UsuarioResponseDto:
      type: object
      properties:
        usuarioId:
          type: integer
        correo:
          type: string
          format: email
        nombres:
          type: string
        tipoAutenticacion:
          type: string
        activo:
          type: boolean
    RolResponseDto:
      type: object
      properties:
        rolId:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
    PagedUsuariosResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsuarioResponseDto'
        totalCount:
          type: integer
        pageNumber:
          type: integer
        totalPages:
          type: integer

    # DTOS: Solicitudes
    SolicitudCreateDto:
      type: object
      required:
        - cargoCodigo
        - areaCodigo
        - gerenciaCodigo
        - unidadesCodigo
        - tipoVacanteCodigo
        - remuneracionOfrecida
        - justificacion
      properties:
        cargoCodigo:
          type: string
        areaCodigo:
          type: string
        gerenciaCodigo:
          type: string
        unidadesCodigo:
          type: string
        tipoVacanteCodigo:
          type: string
        remuneracionOfrecida:
          type: number
        justificacion:
          type: string
          minLength: 10
    SolicitudUpdateDto:
      type: object
      properties:
        remuneracionOfrecida:
          type: number
        justificacion:
          type: string
    SolicitudResponseDto:
      type: object
      properties:
        solicitudId:
          type: integer
        cargoCodigo:
          type: string
        areaCodigo:
          type: string
        remuneracionOfrecida:
          type: number
        estadoNombre:
          type: string
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        justificacionRechazo:
          type: string
          nullable: true
          description: Mensaje de justificación de rechazo de la solicitud por parte de RRHH (si está en estado SOL-RECH).
        observacionesRrhh:
          type: array
          items:
            $ref: '#/components/schemas/ObservacionResponseDto'
          description: Lista de observaciones detalladas registradas por RRHH para subsanación.
    ObservacionResponseDto:
      type: object
      properties:
        observacionId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
        hora:
          type: string
          description: Hora formateada en HH:mm.
        usuarioRrhhId:
          type: integer
          nullable: true
        usuarioRrhhNombre:
          type: string
        rol:
          type: string
        comentario:
          type: string
        observacion:
          type: string
        campoObservado:
          type: string
          nullable: true
        estadoAsociado:
          type: string
        fechaCreacion:
          type: string
          format: date-time
        fechaModificacion:
          type: string
          format: date-time
          nullable: true
    PagedSolicitudesResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudResponseDto'
        totalCount:
          type: integer

    # DTOS: Perfiles
    PerfilResponseDto:
      type: object
      properties:
        perfilId:
          type: integer
        solicitudId:
          type: integer
        cargoNombre:
          type: string
        profesiogramaJson:
          type: string
        versionActiva:
          type: integer
        estadoNombre:
          type: string

    # DTOS: Vacantes
    VacanteCreateDto:
      type: object
      required:
        - solicitudId
        - perfilId
        - fechaLimiteCobertura
      properties:
        solicitudId:
          type: integer
        perfilId:
          type: integer
        fechaLimiteCobertura:
          type: string
          format: date
    VacanteResponseDto:
      type: object
      properties:
        vacanteId:
          type: integer
        solicitudId:
          type: integer
        perfilId:
          type: integer
        estadoNombre:
          type: string
        fechaLimiteCobertura:
          type: string
    PagedVacantesResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VacanteResponseDto'
        totalCount:
          type: integer

    # DTOS: Postulantes
    PostulanteRegistroRequestDto:
      type: object
      required:
        - vacanteId
        - correo
        - cvFile
      properties:
        vacanteId:
          type: integer
          description: Identificador de la vacante a la que postula el candidato.
        correo:
          type: string
          format: email
          description: Correo de contacto del postulante.
        cvFile:
          type: string
          format: binary
          description: |
            Archivo del Currículum Vitae del candidato.
            * **Extensiones permitidas:** .pdf, .docx
            * **MIME Types permitidos:** application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document
            * **Tamaño máximo permitido:** 5 MB (5,242,880 bytes)
    PostulanteResponseDto:
      type: object
      properties:
        postulanteId:
          type: integer
        correo:
          type: string
        estadoNombre:
          type: string
        fechaRegistro:
          type: string
    PagedPostulantesResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostulanteResponseDto'
        totalCount:
          type: integer
    PostulanteExpedienteDto:
      type: object
      properties:
        postulanteId:
          type: integer
        correo:
          type: string
        parsedTextCV:
          type: string
        skills:
          type: array
          items:
            type: string
        matchingScore:
          type: integer
        explicabilidadIA:
          type: string
        estadoNombre:
          type: string

    # DTOS: Entrevistas
    EntrevistaProgramarDto:
      type: object
      required:
        - postulanteId
        - vacanteId
        - entrevistadorCorreo
        - fechaHoraProgramacion
        - modalidadCodigo
      properties:
        postulanteId:
          type: integer
        vacanteId:
          type: integer
        entrevistadorCorreo:
          type: string
          format: email
        fechaHoraProgramacion:
          type: string
          format: date-time
        modalidadCodigo:
          type: string

    # DTOS: Ofertas
    OfertaCreateDto:
      type: object
      required:
        - postulanteId
        - vacanteId
        - salarioOfrecido
        - fechaValidezOferta
      properties:
        postulanteId:
          type: integer
        vacanteId:
          type: integer
        salarioOfrecido:
          type: number
        fechaValidezOferta:
          type: string
          format: date

    # DTOS: Contratación
    ContratacionCreateDto:
      type: object
      required:
        - postulanteId
        - vacanteId
        - fechaEfectivaIngreso
      properties:
        postulanteId:
          type: integer
        vacanteId:
          type: integer
        fechaEfectivaIngreso:
          type: string
          format: date

    # DTOS: Reportes e Historiales
    ExecutiveDashboardResponseDto:
      type: object
      properties:
        tiempoPromedioCoberturaDias:
          type: number
        tasaAceptacionOfertasPorcentaje:
          type: number
        costoAcumuladoTokensIA:
          type: number
        alertasSlaCriticasCount:
          type: integer
    StateHistoryResponseDto:
      type: object
      properties:
        historyId:
          type: integer
        entidadId:
          type: integer
        estadoAnterior:
          type: string
        estadoNuevo:
          type: string
        cambiadoPor:
          type: string
        fechaCambio:
          type: string
          format: date-time
        justificacion:
          type: string

    # DTOS: Auditoría y Errores
    AuditLogResponseDto:
      type: object
      properties:
        logId:
          type: integer
        usuario:
          type: string
        rol:
          type: string
        fecha:
          type: string
        accion:
          type: string
        entidad:
          type: string
        correlationId:
          type: string
          format: uuid
    PagedAuditLogsResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponseDto'
        totalCount:
          type: integer
    InconsistenciaDto:
      type: object
      required:
        - campo
        - detalle
      properties:
        campo:
          type: string
        detalle:
          type: string
    SolicitudResumenRequestDto:
      type: object
      required:
        - captureState
        - recommendation
        - agenteName
        - agenteVersion
      properties:
        profileSummary:
          type: string
        captureState:
          type: string
          enum: [PARCIAL, COMPLETO]
        captureConfidence:
          type: number
        recommendation:
          type: string
          enum: [APROBAR_REVISION, OBSERVAR, RECHAZAR_DATOS_INSUFICIENTES]
        missingFields:
          type: array
          items:
            type: string
        inconsistencias:
          type: array
          items:
            $ref: '#/components/schemas/InconsistenciaDto'
        agenteName:
          type: string
        agenteVersion:
          type: string
        correlationId:
          type: string
          format: uuid

    ApiErrorDto:
      type: object
      properties:
        Code:
          type: string
          description: Código semántico de error (ej. INVALID_CREDENTIALS, CIRCULAR_DEPENDENCY_DETECTED).
        Message:
          type: string
          description: Mensaje legible de error.
        Detail:
          type: string
          description: Detalles técnicos o de validación de campos.
        CorrelationId:
          type: string
          format: uuid
          description: CorrelationId para rastreo en logs de servidor.

    VacancyRequestResponseDto:
      type: object
      properties:
        id:
          type: integer
        requestCode:
          type: string
        title:
          type: string
        area:
          type: string
        requestedByUsuarioId:
          type: string
        requestedByUserId:
          type: string
        reason:
          type: string
        requestType:
          type: string
        vacancyCount:
          type: integer
        seniority:
          type: string
        mainFunctions:
          type: string
        requiredSkills:
          type: string
        channel:
          type: string
        decisionMaker:
          type: string
        priority:
          type: string
        employmentType:
          type: string
        workMode:
          type: string
        location:
          type: string
        comments:
          type: string
        status:
          type: string
        fechaIdeal:
          type: string
          format: date-time
