  # ==========================================
  # DOMINIO: CALLBACKS DE INTEGRACIÓN (n8n ──> .NET 8)
  # ==========================================
  /api/v1/callbacks/solicitud-consistencia:
    post:
      summary: Callback del AgenteSolicitud (Idempotente)
      description: |
        Endpoint asíncrono invocado por n8n para retornar la validación de consistencia del requerimiento de personal.
        Protegido por el middleware de idempotencia y validación del CorrelationId.
      tags:
        - Callbacks n8n
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - solicitudId
                - esConsistente
                - observaciones
              properties:
                solicitudId:
                  type: integer
                esConsistente:
                  type: boolean
                observaciones:
                  type: string
      responses:
        '200':
          description: Callback recibido y procesado (o duplicado filtrado).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'
        '202':
          description: Callback en procesamiento.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/callbacks/perfil-creacion:
    post:
      summary: Callback de Creación de Perfil por IA (Idempotente)
      description: Retorna el snapshot estructurado del profesiograma del cargo generado por el AgentePerfil.
      tags:
        - Callbacks n8n
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - solicitudId
                - profesiogramaRawJson
              properties:
                solicitudId:
                  type: integer
                profesiogramaRawJson:
                  type: string
      responses:
        '200':
          description: Callback procesado con éxito.

  /api/v1/callbacks/cv-parsing:
    post:
      summary: Callback de Parsing de CV por IA
      description: Recibe los datos curriculares estructurados obtenidos tras el parsing del archivo.
      tags:
        - Callbacks n8n
      security:
        - ApiKeyAuth: []
      parameters:
        - name: X-Correlation-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postulanteId
                - parsedTextCV
                - skillsDetectados
              properties:
                postulanteId:
                  type: integer
                parsedTextCV:
                  type: string
                skillsDetectados:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Parsing guardado.

