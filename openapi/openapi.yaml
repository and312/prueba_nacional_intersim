openapi: 3.1.0
info:
  title: Sistema Inteligente de Reclutamiento (SIR) - Nacional Seguros
  description: |
    Contrato oficial y especificación de APIs para la Fase 1 del Sistema Inteligente de Reclutamiento de Nacional Seguros.
    Esta API sirve como el contrato formal entre el Frontend en Angular 17+, el Backend en .NET 8, los Workflows de n8n y los motores de IA.
    
    ### Principios Clave:
    * **Trazabilidad:** Inyección y propagación obligatoria del encabezado `X-Correlation-ID`.
    * **Idempotencia:** Endpoints de callback protegidos mediante `IdempotencyFilter`.
    * **Seguridad:** Autenticación híbrida Local/Directorio Corporativo y Rotación de Refresh Tokens (RTR).
    * **Auditoría:** Registro automático de modificaciones de datos en `AuditLog` y transiciones en `StateHistory`.
  version: 1.0.0
servers:
  - url: https://api.nacionalseguros.com.bo
    description: Servidor de Producción (Cifrado HTTPS TLS 1.3)
  - url: https://qa-api.nacionalseguros.com.bo
    description: Servidor de Pruebas y Aseguramiento de Calidad (QA)
  - url: http://localhost:5000
    description: Servidor de Desarrollo Local
paths:
  # ==========================================
  # DOMINIO: AUTENTICACIÓN
  # ==========================================
  /api/v1/auth/login:
    post:
      summary: Login de Usuario (Híbrido Directorio Corporativo / Local)
      description: |
        Autentica credenciales locales o delega al servicio de directorio corporativo. 
        Si el usuario es del directorio corporativo, el backend valida el token externo, aprovisiona si es necesario y emite un JWT local con claims de roles de la base de datos.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: Autenticación exitosa. Retorna el token JWT de acceso y configura el Refresh Token.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      summary: Cierre de Sesión del Usuario
      description: Invalida el Refresh Token de un solo uso activo en la tabla `Sesion`.
      tags:
        - Autenticación
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cierre de sesión completado.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      summary: Renovación de Token de Acceso (RTR - Refresh Token Rotation)
      description: |
        Invalida el Refresh Token enviado (`Activa = 0`) y emite un nuevo JWT y un nuevo Refresh Token.
        Si se detecta un intento de reuso de un token obsoleto, se anulan todas las sesiones activas del usuario.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestDto'
      responses:
        '200':
          description: Token renovado con éxito.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/auth/mfa:
    post:
      summary: Verificación de Segundo Factor de Autenticación (MFA)
      description: Valida el código TOTP enviado al dispositivo móvil o correo del usuario para validar el inicio de sesión.
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequestDto'
      responses:
        '200':
          description: Segundo factor verificado con éxito.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/auth/change-password:
    post:
      summary: Cambio de Contraseña de Usuario Local
      description: Permite al usuario cambiar su clave. Bloqueado para usuarios del directorio corporativo.
      tags:
        - Autenticación
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequestDto'
      responses:
        '200':
          description: Contraseña cambiada con éxito.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ==========================================
  # DOMINIO: USUARIOS Y SEGURIDAD (RBAC)
  # ==========================================
  /api/v1/usuarios:
    get:
      summary: Listar Usuarios Registrados
      description: Obtiene la lista de usuarios. Soporta filtros de búsqueda, paginación y ordenación.
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Lista de usuarios obtenida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsuariosResponseDto'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Crear Nuevo Usuario
      description: Registra un usuario local o pre-aprovisiona un usuario corporativo del directorio de identidad.
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreateDto'
      responses:
        '201':
          description: Usuario creado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponseDto'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/usuarios/{id}:
    get:
      summary: Consultar Detalles de un Usuario
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponseDto'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Actualizar Datos de un Usuario
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdateDto'
      responses:
        '200':
          description: Usuario actualizado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponseDto'
    delete:
      summary: Inactivar Usuario (Soft Delete)
      description: Marca IsDeleted = 1 en base de datos.
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Usuario inactivado con éxito.

  /api/v1/usuarios/{id}/roles:
    get:
      summary: Consultar Roles Asignados a un Usuario
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Roles del usuario obtenidos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RolResponseDto'
    put:
      summary: Asignar Roles a un Usuario (RBAC)
      description: Sobrescribe los roles del usuario. Genera auditoría de seguridad.
      tags:
        - Usuarios
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rolIds
              properties:
                rolIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Roles actualizados.

  # ==========================================
  # DOMINIO: SOLICITUDES DE PERSONAL
  # ==========================================
  /api/v1/solicitudes:
    post:
      summary: Crear Solicitud de Personal (Líder Solicitante)
      description: Inicia el flujo en estado 'Borrador' o 'PendienteAprobacion'.
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCreateDto'
      responses:
        '201':
          description: Solicitud creada. Escribe registro en StateHistory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponseDto'
    get:
      summary: Listar Solicitudes con Filtros
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: estadoId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Lista de solicitudes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSolicitudesResponseDto'

  /api/v1/solicitudes/{id}:
    get:
      summary: Obtener Detalles de una Solicitud
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Solicitud encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponseDto'
    put:
      summary: Modificar una Solicitud (Solo en Borrador / Observada)
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudUpdateDto'
      responses:
        '200':
          description: Solicitud modificada.

  /api/v1/solicitudes/{id}/enviar:
    post:
      summary: Enviar Solicitud de Personal a RRHH
      description: Valida completitud de campos críticos y transita la solicitud a 'SOL-ENV' (Enviada a RRHH).
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Solicitud enviada a RRHH y registrada en StateHistory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudResponseDto'

  /api/v1/solicitudes/{id}/aprobar:
    post:
      summary: Aprobar Solicitud de Personal (Decisor / RRHH)
      description: Transita la solicitud a 'Aprobada'. Dispara el workflow de creación de perfil asíncrono.
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                observaciones:
                  type: string
      responses:
        '200':
          description: Solicitud aprobada y registrada en StateHistory.

  /api/v1/solicitudes/{id}/rechazar:
    post:
      summary: Rechazar Solicitud de Personal
      description: Transita la solicitud a 'Rechazada' de manera definitiva. Requiere comentario.
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - justificacion
              properties:
                justificacion:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Solicitud rechazada.

  /api/v1/solicitudes/{id}/historial:
    get:
      summary: Consultar Historial de Estados de una Solicitud
      description: Retorna la bitácora completa de transiciones de estados del requerimiento.
      tags:
        - Solicitudes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Historial de transiciones obtenido.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateHistoryResponseDto'

  # ==========================================
  # DOMINIO: PERFILES (PROFESIOGRAMAS)
  # ==========================================
  /api/v1/perfiles/generar:
    post:
      summary: Generar Borrador de Profesiograma mediante IA (AgentePerfil)
      description: Dispara el trigger asíncrono hacia n8n para estructurar el perfil. Responde 202 Accepted.
      tags:
        - Perfiles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - solicitudId
              properties:
                solicitudId:
                  type: integer
      responses:
        '202':
          description: Proceso de generación iniciado en n8n.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'

  /api/v1/perfiles/{id}:
    get:
      summary: Consultar un Profesiograma y sus Versiones
      tags:
        - Perfiles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Profesiograma obtenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponseDto'

  /api/v1/perfiles/{id}/aprobar:
    post:
      summary: Aprobar Profesiograma (Analista RRHH)
      description: Transita el perfil a 'Aprobado', haciéndolo elegible para abrir vacantes activas.
      tags:
        - Perfiles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Perfil aprobado.

  /api/v1/perfiles/{id}/observar:
    post:
      summary: Observar y Devolver Profesiograma a Edición
      description: Transita el perfil a 'Observado' con justificación escrita para reajustes de la IA o el usuario.
      tags:
        - Perfiles
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - justificacion
              properties:
                justificacion:
                  type: string
      responses:
        '200':
          description: Perfil observado y retornado.

  # ==========================================
  # DOMINIO: VACANTES
  # ==========================================
  /api/v1/vacantes:
    post:
      summary: Crear una Vacante a partir de Solicitud y Perfil Aprobados
      description: Inicializa la vacante en estado 'Creada'.
      tags:
        - Vacantes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacanteCreateDto'
      responses:
        '201':
          description: Vacante registrada física y lógicamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacanteResponseDto'
    get:
      summary: Consultar Listado de Vacantes
      tags:
        - Vacantes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lista de vacantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedVacantesResponseDto'

  /api/v1/vacantes/{id}/publicar:
    post:
      summary: Publicar Vacante en Canales (LinkedIn, Web)
      description: Transita la vacante a 'Publicada'. Dispara el Agente de Sourcing en n8n de forma asíncrona.
      tags:
        - Vacantes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - canalIds
              properties:
                canalIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Vacante publicada e integraciones externas gatilladas.

  /api/v1/vacantes/{id}/cerrar:
    post:
      summary: Cerrar Vacante (Posición Cubierta)
      description: Transita la vacante a 'Cerrada' tras seleccionar un postulante ganador. Detiene el SLA de Cobertura.
      tags:
        - Vacantes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - postulanteContratadoId
              properties:
                postulanteContratadoId:
                  type: integer
      responses:
        '200':
          description: Vacante cerrada exitosamente.

  /api/v1/vacantes/{id}/cancelar:
    post:
      summary: Cancelar Vacante
      description: Requiere registrar un motivo del catálogo de motivos de cancelación en base de datos.
      tags:
        - Vacantes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - motivoCancelacionCodigo
              properties:
                motivoCancelacionCodigo:
                  type: string
      responses:
        '200':
          description: Vacante cancelada y liberada.

  # ==========================================
  # DOMINIO: POSTULANTES
  # ==========================================
  /api/v1/postulantes/registro:
    post:
      summary: Registrar Postulante e Iniciar Parsing de CV (n8n Webhook / Frontend)
      description: |
        Registra datos iniciales y dispara el parsing asíncrono del PDF/Docx del CV.
        * **Seguridad (Rate Limiting):** Este endpoint público está protegido con un límite de tasa de 10 peticiones por minuto por dirección IP de origen para evitar abuso de almacenamiento e inferencia de IA.
      tags:
        - Postulantes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostulanteRegistroRequestDto'
      responses:
        '202':
          description: Postulante registrado. Carga del CV recibida, parsing asíncrono iniciado en n8n.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/postulantes:
    get:
      summary: Listar Postulantes Registrados
      tags:
        - Postulantes
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - name: vacanteId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Listado obtenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPostulantesResponseDto'

  /api/v1/postulantes/{id}:
    get:
      summary: Obtener Expediente Completo del Postulante
      description: Retorna perfil, texto de CV parseado y puntajes de Scoring de la IA (anonimizados o completos según rol).
      tags:
        - Postulantes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Expediente retornado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostulanteExpedienteDto'

  /api/v1/postulantes/{id}/estado:
    put:
      summary: Cambiar Estado del Postulante en el Pipeline (Transición Manual)
      description: Transita al postulante (ej. de 'Screening' a 'Entrevista', o 'Descartado'). Exige justificación si es descarte.
      tags:
        - Postulantes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nuevoEstadoId
              properties:
                nuevoEstadoId:
                  type: integer
                motivoDescarteCodigo:
                  type: string
                justificacionText:
                  type: string
      responses:
        '200':
          description: Estado del postulante actualizado y auditado en StateHistory.

  # ==========================================
  # DOMINIO: ENTREVISTAS
  # ==========================================
  /api/v1/entrevistas/programar:
    post:
      summary: Programar Entrevista (Gatilla reserva en Outlook y enlace de Teams vía n8n)
      description: Registra la cita y gatilla la llamada de integración asíncrona hacia Microsoft Graph API.
      tags:
        - Entrevistas
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrevistaProgramarDto'
      responses:
        '201':
          description: Registro de entrevista creado, agendamiento iniciado.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationIdHeader'

  /api/v1/entrevistas/{id}/confirmar:
    post:
      summary: Confirmar Asistencia a Entrevista (Postulante / n8n Callback)
      description: Marca la entrevista como 'Confirmada' y desactiva las alertas de recordatorio.
      tags:
        - Entrevistas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cita confirmada.

  /api/v1/entrevistas/{id}/reprogramar:
    post:
      summary: Reprogramar Entrevista (Máximo 3 permitidas por SLA)
      tags:
        - Entrevistas
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
