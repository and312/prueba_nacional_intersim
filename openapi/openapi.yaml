                  maximum: 100
                scoreTecnico:
                  type: integer
                  minimum: 0
                  maximum: 100
                scoreExperiencia:
                  type: integer
                  minimum: 0
                  maximum: 100
                scoreCultural:
                  type: integer
                  minimum: 0
                  maximum: 100
                explicabilidadDetalle:
    post:
      summary: Callback del AgenteScoring (Evaluación e Idoneidad)
