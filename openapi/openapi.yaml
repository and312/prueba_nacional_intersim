                vacanteId:
                  type: integer
                scoreGeneral:
                  type: integer
                  minimum: 0
                  maximum: 100
                scoreTecnico:
                  type: integer
                  minimum: 0
                  maximum: 100
                scoreExperiencia:
                  type: integer
                  minimum: 0
                  maximum: 100
                scoreCultural:
                  type: integer
                  minimum: 0
                  maximum: 100
                explicabilidadDetalle:
                  type: string
      responses:
        '200':
